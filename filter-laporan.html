<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Laporan - Revolusi Studio</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.15); --glass-border: rgba(255, 255, 255, 0.25); --ios-blue: #007AFF; --text-main: #ffffff; }
        body {
            margin: 0; padding: 20px; font-family: -apple-system, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1614851099511-773084f6911d?q=80&w=1170&auto=format&fit=crop');
            background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .glass-card {
            background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--glass-border);
            border-radius: 25px; padding: 40px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; width: 100%; max-width: 400px; color: white;
        }
        h2 { margin: 0 0 10px 0; font-size: 24px; font-weight: 700; }
        p { margin: 0 0 25px 0; opacity: 0.8; font-size: 14px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; margin-left: 5px; opacity: 0.9; }
        input[type="date"] {
            width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px; color: white; font-size: 16px; box-sizing: border-box; text-align: center; color-scheme: dark;
        }
        input:focus { outline: none; border-color: var(--ios-blue); background: rgba(0,0,0,0.4); }
        button {
            width: 100%; padding: 16px; background: var(--ios-blue); color: white; border: none; border-radius: 15px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0, 122, 255, 0.3);
        }
        button:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="glass-card">
        <h2>📊 Filter Laporan</h2>
        <p>Pilih rentang waktu untuk Dashboard Keuangan</p>

        <div class="form-group">
            <label>Tanggal Mulai</label>
            <input type="date" id="tgl-mulai" required>
        </div>
        
        <div class="form-group">
            <label>Tanggal Selesai</label>
            <input type="date" id="tgl-selesai" required>
        </div>

        <button onclick="terapkanFilter()">Lihat Dashboard &rarr;</button>
        
        <div style="margin-top: 20px; font-size: 12px; opacity: 0.6; font-weight: bold; color: #85e09b;">
            🚀 Powered by Supabase (PostgreSQL)
        </div>
    </div>

    <script>
        // Set default: Bulan ini (Tanggal 1 s/d Hari ini)
        const d = new Date();
        // Mengatasi masalah timezone pada bulan saat setup default value
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        
        document.getElementById('tgl-mulai').value = `${yyyy}-${mm}-01`;
        document.getElementById('tgl-selesai').value = `${yyyy}-${mm}-${dd}`;

        window.terapkanFilter = function() {
            const mulai = document.getElementById('tgl-mulai').value;
            const selesai = document.getElementById('tgl-selesai').value;

            if(!mulai || !selesai) {
                alert("⚠️ Pilih tanggalnya dulu, Bos!");
                return;
            }

            localStorage.setItem("filterMulai", mulai);
            localStorage.setItem("filterSelesai", selesai);
            window.location.href = "laporan.html"; // Lompat ke Dashboard
        }
    </script>
</body>
</html>
