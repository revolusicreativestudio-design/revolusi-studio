<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Add-on & Minuman</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.2); --glass-border: rgba(255, 255, 255, 0.3); --ios-orange: #FF9500; --ios-red: #FF3B30; --text-main: #ffffff; }
        body { margin: 0; padding: 20px; font-family: -apple-system, sans-serif; color: var(--text-main); background: #111; background-image: url('https://images.unsplash.com/photo-1647346425804-34383b95644b?q=80&w=1332&auto=format&fit=crop'); background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .glass-container { width: 90%; max-width: 400px; background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 35px; padding: 35px 25px; box-shadow: 0 25px 50px rgba(0,0,0,0.4); text-align: center; }
        h1 { font-size: 26px; font-weight: 800; margin-bottom: 5px; color: var(--ios-orange); }
        p.subtitle { font-size: 14px; opacity: 0.8; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; margin-left: 5px; }
        input, select { width: 100%; padding: 14px 18px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px; color: white; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        input:focus, select:focus { outline: none; border-color: var(--ios-orange); background: rgba(0,0,0,0.5); }
        input#diskon { color: #ff8a80; font-weight: bold; }
        optgroup { background: #333; color: #ff9500; font-weight: bold; }
        option { background-color: #1a1a2e; color: white; font-weight: normal; }
        .price-tag { background: rgba(0, 0, 0, 0.2); padding: 15px; border-radius: 20px; margin: 25px 0; border: 1px dashed var(--glass-border); }
        .total-amount { font-size: 28px; font-weight: 900; color: #85e09b; }
        button { width: 100%; padding: 18px; background: var(--ios-orange); color: white; border: none; border-radius: 20px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="glass-container">
    <form id="formAddon">
        <h1>Mini POS Studio</h1>
        <p class="subtitle">Kasir Print, Keychain & Minuman</p>

        <div class="form-group">
            <label>Pilih Produk</label>
            <select id="produk" onchange="hitungTotalAddon()">
                <!-- VALUE formatnya = "Kategori (Tema) | Nama Produk" -->
                <optgroup label="🗝️ Kategori: Keychain">
                    <option value="MERCH - Keychain|Keychain Premium" data-harga="10000">Keychain Premium (Rp 10.000)</option>
                    <option value="MERCH - Keychain|Keychain Akrilik" data-harga="15000">Keychain Akrilik (Rp 15.000)</option>
                </optgroup>
                <optgroup label="📸 Kategori: Print Foto">
                    <option value="MERCH - Print|Extra Print 4R" data-harga="5000">Extra Print 4R (Rp 5.000)</option>
                    <option value="MERCH - Print|Cetak Polaroid" data-harga="3000">Cetak Polaroid (Rp 3.000)</option>
                </optgroup>
                <optgroup label="🥤 Kategori: Soft Drink">
                    <option value="MERCH - Drink|Air Mineral" data-harga="4000">Air Mineral (Rp 4.000)</option>
                    <option value="MERCH - Drink|Teh Pucuk / Floridina" data-harga="5000">Teh Botol / Pucuk (Rp 5.000)</option>
                    <option value="MERCH - Drink|Kopi Botol" data-harga="6000">Kopi Botol (Rp 6.000)</option>
                </optgroup>
            </select>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>Jumlah (Qty)</label>
                <input type="number" id="qty" value="1" min="1" required oninput="hitungTotalAddon()">
            </div>
            <div class="form-group" style="flex: 2;">
                <label>Diskon (Rp)</label>
                <input type="number" id="diskon" value="0" min="0" required oninput="hitungTotalAddon()">
            </div>
        </div>

        <div class="form-group">
            <label>Pembayaran</label>
            <select id="pembayaran">
                <option value="Cash">Tunai / Cash</option>
                <option value="QRIS">QRIS / Transfer</option>
            </select>
        </div>

        <div class="price-tag">
            <div style="font-size: 12px; opacity: 0.7;">TOTAL BAYAR:</div>
            <div class="total-amount" id="display-total">Rp 10.000</div>
        </div>

        <button type="submit" id="btnJual">🛍️ CATAT KE GOOGLE SHEETS</button>
    </form>
</div>

<script>
    // URL Google Apps Script Anda (Pastikan ini link API Anda yang aktif)
    const URL_GAS = "https://script.google.com/macros/s/AKfycbwPdoH2h6VZLGb_LBeIO8Fi1yBrmY8Efm2hWry_9myk6mCbSkQqi6WQOHaXxIxk43BAjQ/exec";

    window.hitungTotalAddon = function() {
        const select = document.getElementById('produk');
        const hargaSatuan = parseInt(select.options[select.selectedIndex].getAttribute('data-harga')) || 0;
        const qty = parseInt(document.getElementById('qty').value) || 1;
        const diskon = parseInt(document.getElementById('diskon').value) || 0;
        
        let total = (hargaSatuan * qty) - diskon;
        if (total < 0) total = 0;
        document.getElementById('display-total').innerText = "Rp " + total.toLocaleString('id-ID');
        return total;
    };

    document.getElementById('formAddon').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnJual');
        
        // Memecah value produk (Kategori/Tema | Nama Produk)
        const produkValue = document.getElementById('produk').value;
        const [kategoriTema, namaProduk] = produkValue.split('|'); 
        
        const qty = document.getElementById('qty').value;
        const diskon = parseInt(document.getElementById('diskon').value) || 0;
        const metode = document.getElementById('pembayaran').value;
        const total = window.hitungTotalAddon();

        btn.innerText = "Menyimpan ke Sheets... ⏳";
        btn.disabled = true;

        try {
            const d = new Date();
            const tglToday = d.getDate().toString().padStart(2, '0') + "/" + (d.getMonth() + 1).toString().padStart(2, '0') + "/" + d.getFullYear();

            // Setup Keterangan Diskon
            let deskripsi = "Beli " + qty + "x " + namaProduk;
            if (diskon > 0) deskripsi += ` (Diskon Rp ${diskon.toLocaleString('id-ID')})`;

            // Mengirim data ke Google Sheets menggunakan form-urlencoded
            const formData = new URLSearchParams();
            formData.append('tanggal', tglToday);
            formData.append('nama', deskripsi);
            formData.append('wa', "-");
            formData.append('status', "Selesai");
            formData.append('tema', kategoriTema); // Masuk sebagai "MERCH - Keychain", dll.
            formData.append('jumlah', qty);
            formData.append('pembayaran', metode);
            formData.append('total', total);

            const response = await fetch(URL_GAS, { method: 'POST', body: formData });
            
            alert(`✅ Nota Sukses! ${namaProduk} masuk ke Google Sheets.`);
            document.getElementById('qty').value = "1";
            document.getElementById('diskon').value = "0";
            window.hitungTotalAddon();

        } catch (error) {
            console.error(error);
            alert("❌ Terjadi kesalahan jaringan. Cek koneksi Anda.");
        } finally {
            btn.innerText = "🛍️ CATAT KE GOOGLE SHEETS";
            btn.disabled = false;
        }
    });

    // Inisiasi awal
    window.hitungTotalAddon();
</script>
</body>
</html>
