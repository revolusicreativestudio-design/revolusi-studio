<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Add-on & Minuman - Supabase</title>
    <!-- Library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.2); --glass-border: rgba(255, 255, 255, 0.3); --ios-orange: #FF9500; --ios-red: #FF3B30; --text-main: #ffffff; }
        body { margin: 0; padding: 20px; font-family: -apple-system, sans-serif; color: var(--text-main); background: #111; background-image: url('https://images.unsplash.com/photo-1647346425804-34383b95644b?q=80&w=1332&auto=format&fit=crop'); background-size: cover; background-attachment: fixed; }
        .container { max-width: 500px; margin: 0 auto; }
        .glass-card { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 25px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); margin-bottom: 20px; }
        h1 { font-size: 24px; font-weight: 800; margin: 0 0 5px 0; color: var(--ios-orange); text-align: center; }
        p.subtitle { font-size: 13px; opacity: 0.8; margin: 0 0 20px 0; text-align: center; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; margin-left: 5px; opacity: 0.9; }
        input, select { width: 100%; padding: 12px 15px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; color: white; font-size: 15px; box-sizing: border-box; transition: 0.3s; }
        input:focus, select:focus { outline: none; border-color: var(--ios-orange); background: rgba(0,0,0,0.5); }
        option { background-color: #1a1a2e; color: white; }
        
        .btn-tambah { width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.4); color: white; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        .btn-tambah:active { transform: scale(0.98); }
        
        .cart-area { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 15px; min-height: 80px; margin-bottom: 15px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 10px 0; }
        .cart-item:last-child { border-bottom: none; }
        .cart-item-title { font-weight: bold; font-size: 14px; }
        .cart-item-price { font-size: 12px; opacity: 0.7; color: #85e09b; }
        .btn-hapus { background: rgba(255, 59, 48, 0.2); border: 1px solid var(--ios-red); color: #ff8a80; border-radius: 8px; padding: 5px 10px; font-size: 11px; cursor: pointer; }
        
        .total-box { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 149, 0, 0.15); border: 1px dashed var(--ios-orange); border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .total-angka { font-size: 24px; font-weight: 900; color: #ffd699; }
        .btn-checkout { width: 100%; padding: 18px; background: var(--ios-orange); color: white; border: none; border-radius: 15px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(255, 149, 0, 0.3); }
        .btn-checkout:disabled { background: #555; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h1>Mini POS Studio</h1>
        <p class="subtitle">Sistem Kasir Keranjang Belanja (Supabase)</p>
        
        <div class="form-group">
            <label>Pilih Produk (Tarik dari Database)</label>
            <select id="produk"><option value="">Memuat menu dari server...</option></select>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;"><label>Qty</label><input type="number" id="qty" value="1" min="1"></div>
            <div class="form-group" style="flex: 1.5;"><label>Diskon (Rp)</label><input type="number" id="diskon" value="0" min="0"></div>
        </div>
        
        <button type="button" class="btn-tambah" onclick="tambahKeKeranjang()">🛒 Tambah ke Keranjang</button>
    </div>

    <div class="glass-card">
        <h2 style="font-size: 16px; margin: 0 0 15px 0;">🧾 Daftar Keranjang</h2>
        <div class="cart-area" id="area-keranjang"><div style="text-align: center; opacity: 0.5; padding-top: 20px; font-size: 13px;">Keranjang kosong</div></div>
        
        <div class="form-group">
            <label>Metode Pembayaran</label>
            <select id="pembayaran"><option value="Cash">Tunai / Cash</option><option value="QRIS">QRIS / Transfer</option></select>
        </div>
        
        <div class="total-box">
            <div style="font-size: 12px; font-weight: bold; opacity: 0.8;">GRAND TOTAL :</div>
            <div class="total-angka" id="grand-total">Rp 0</div>
        </div>
        <button type="button" class="btn-checkout" id="btn-checkout" onclick="prosesCheckout()" disabled>🛍️ PROSES PEMBAYARAN</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://jxlpoqjfblnjxcfbnkjf.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4bHBvcWpmYmxuanhjZmJua2pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwODI0NzYsImV4cCI6MjA5ODY1ODQ3Nn0.iJpxBgGtnjYNui7YdoLnrvfiL20pdGb2mLdUUvaGqJU'; 
    const dbKlien = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let keranjang = [];

    // 1. Tarik Data Menu Otomatis dari Tabel master_addon
    window.onload = async function() {
        try {
            const { data, error } = await dbKlien.from('master_addon').select('*').order('nama_produk', { ascending: true });
            if (error) throw error;
            
            const select = document.getElementById('produk');
            select.innerHTML = "";
            
            if(data && data.length > 0) {
                data.forEach(item => {
                    // Cerdas Deteksi Kategori (Tema) berdasarkan nama produk
                    let temaStr = "MERCH";
                    let namaLower = item.nama_produk.toLowerCase();
                    if(namaLower.includes("keychain") || namaLower.includes("ganci")) temaStr = "MERCH - Keychain";
                    else if(namaLower.includes("print") || namaLower.includes("cetak") || namaLower.includes("frame")) temaStr = "MERCH - Print";
                    else if(namaLower.includes("air") || namaLower.includes("teh") || namaLower.includes("kopi") || namaLower.includes("botol")) temaStr = "MERCH - Drink";

                    select.innerHTML += `<option value="${temaStr}|${item.nama_produk}" data-harga="${item.harga_jual}">${item.nama_produk} (Rp ${item.harga_jual.toLocaleString('id-ID')})</option>`;
                });
            } else {
                select.innerHTML = '<option value="">Produk kosong. Atur di menu Setting Add-on</option>';
            }
        } catch (e) {
            console.error("Gagal muat menu", e);
            document.getElementById('produk').innerHTML = '<option value="">Gagal koneksi ke database</option>';
        }
    };

    window.tambahKeKeranjang = function() {
        const select = document.getElementById('produk');
        if(!select.options.length || select.value === "") return;
        
        const [tema, namaProduk] = select.value.split('|'); 
        const hargaSatuan = parseInt(select.options[select.selectedIndex].getAttribute('data-harga')) || 0;
        const qty = parseInt(document.getElementById('qty').value) || 1;
        const diskon = parseInt(document.getElementById('diskon').value) || 0;
        
        let subtotal = (hargaSatuan * qty) - diskon;
        if (subtotal < 0) subtotal = 0;

        let deskripsi = `Beli ${qty}x ${namaProduk}`;
        if (diskon > 0) deskripsi += ` (Diskon Rp ${diskon.toLocaleString('id-ID')})`;

        keranjang.push({ id: Date.now(), tema: tema, nama: deskripsi, qty: qty, hargaSatuan: hargaSatuan, diskon: diskon, subtotal: subtotal });

        document.getElementById('qty').value = "1";
        document.getElementById('diskon').value = "0";
        renderKeranjang();
    };

    window.hapusItem = function(id) {
        keranjang = keranjang.filter(item => item.id !== id);
        renderKeranjang();
    };

    function renderKeranjang() {
        const area = document.getElementById('area-keranjang');
        const btnCheckout = document.getElementById('btn-checkout');
        
        if (keranjang.length === 0) {
            area.innerHTML = '<div style="text-align: center; opacity: 0.5; padding-top: 20px; font-size: 13px;">Keranjang masih kosong</div>';
            document.getElementById('grand-total').innerText = "Rp 0";
            btnCheckout.disabled = true;
            return;
        }

        let html = ""; let grandTotal = 0;
        keranjang.forEach(item => {
            grandTotal += item.subtotal;
            html += `
                <div class="cart-item">
                    <div style="flex:1">
                        <div class="cart-item-title">${item.nama}</div>
                        <div class="cart-item-price">Rp ${item.subtotal.toLocaleString('id-ID')}</div>
                    </div>
                    <button class="btn-hapus" onclick="hapusItem(${item.id})">Hapus</button>
                </div>`;
        });
        area.innerHTML = html;
        document.getElementById('grand-total').innerText = "Rp " + grandTotal.toLocaleString('id-ID');
        btnCheckout.disabled = false;
    }

    // Eksekusi Massal (Bulk Insert) - Super Cepat di Supabase!
    window.prosesCheckout = async function() {
        if (keranjang.length === 0) return;
        
        const btn = document.getElementById('btn-checkout');
        const metode = document.getElementById('pembayaran').value;
        btn.innerText = "Mencetak Nota... ⏳";
        btn.disabled = true;

        const d = new Date();
        const tglToday = d.getDate().toString().padStart(2, '0') + "/" + (d.getMonth() + 1).toString().padStart(2, '0') + "/" + d.getFullYear();

        // Siapkan Bungkusan Data
        const paketData = keranjang.map(item => ({
            tanggal: tglToday,
            nama: item.nama,
            wa: "-",
            status: "Selesai",
            tema: item.tema,
            jumlah: item.qty,
            pembayaran: metode,
            total: item.subtotal
        }));

        try {
            // KIRIM SEMUA BARANG SEKALIGUS (1x Tembakan API)
            const { error } = await dbKlien.from('transaksi').insert(paketData);
            if (error) throw error;

            alert(`✅ TRANSAKSI BERHASIL! \n${keranjang.length} barang masuk ke Database dengan kecepatan cahaya.`);
            keranjang = []; renderKeranjang();

        } catch (error) {
            console.error(error); alert("❌ Gagal menyimpan. Cek koneksi Anda.");
        } finally {
            btn.innerText = "🛍️ PROSES PEMBAYARAN";
            btn.disabled = (keranjang.length === 0);
        }
    };
</script>
</body>
</html>
