<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Pengeluaran Harian - Supabase Edition</title>
    
    <!-- 🚀 MESIN PENGHUBUNG SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.25);
            --ios-red: #FF3B30;
            --ios-green: #34C759;
            --text-main: #ffffff;
        }

        body {
            margin: 0; padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main); background: transparent; 
        }

        .container { max-width: 800px; margin: 0 auto; }

        .glass-card {
            background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); border-radius: 25px; padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center;
        }

        .header h2 { margin: 0 0 5px 0; font-size: 24px; font-weight: 800; }
        .header p { margin: 0 0 25px 0; opacity: 0.8; font-size: 14px; }

        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; margin-left: 5px; opacity: 0.9; }

        input {
            width: 100%; padding: 14px 18px; background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 15px; color: white; font-size: 16px;
            box-sizing: border-box; transition: all 0.3s ease;
        }
        input:focus { outline: none; background: rgba(0, 0, 0, 0.4); border-color: var(--ios-red); }
        
        .grid-kategori {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px; margin-bottom: 25px; text-align: left;
        }
        .item-kategori {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 15px; transition: 0.3s;
        }
        .item-kategori:hover { background: rgba(255, 255, 255, 0.1); }
        .item-kategori label { color: #ff8a80; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .item-kategori input { font-size: 20px; font-weight: bold; color: #85e09b; padding: 10px 15px; }

        button {
            width: 100%; padding: 16px; background: var(--ios-red); color: white;
            border: none; border-radius: 15px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(255, 59, 48, 0.3);
        }
        button:active { transform: scale(0.96); }
        button:disabled { background: rgba(255,255,255,0.3); cursor: not-allowed; box-shadow: none; }

        #progress-bar { display: none; margin-top: 15px; font-size: 14px; font-weight: bold; color: #85e09b; }

    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <div class="header">
            <div style="font-size: 40px; margin-bottom: 10px;">📋💸</div>
            <h2>Checklist Pengeluaran (Supabase)</h2>
            <p>Wajib diisi semua. Ketik <strong>0</strong> jika tidak ada pengeluaran.</p>
        </div>

        <form id="formPengeluaran">
            <div class="form-group" style="max-width: 300px; margin: 0 auto 25px auto;">
                <label style="text-align: center;">Tanggal Pencatatan</label>
                <input type="date" id="tgl-biaya" required style="text-align: center;">
            </div>
            
            <div class="grid-kategori">
                <div class="item-kategori">
                    <label>1. Gaji Karyawan</label>
                    <input type="number" id="kat-gaji" min="0" required placeholder="0">
                </div>
                <div class="item-kategori">
                    <label>2. Kebersihan</label>
                    <input type="number" id="kat-bersih" min="0" required placeholder="0">
                </div>
                <div class="item-kategori">
                    <label>3. Keamanan</label>
                    <input type="number" id="kat-aman" min="0" required placeholder="0">
                </div>
                <div class="item-kategori">
                    <label>4. Internet</label>
                    <input type="number" id="kat-inet" min="0" required placeholder="0">
                </div>
                <div class="item-kategori">
                    <label>5. Sewa Lahan</label>
                    <input type="number" id="kat-lahan" min="0" required placeholder="0">
                </div>
                <div class="item-kategori">
                    <label>6. Sewa Tenda</label>
                    <input type="number" id="kat-tenda" min="0" required placeholder="0">
                </div>
                <div class="item-kategori">
                    <label>7. Tagihan Listrik</label>
                    <input type="number" id="kat-listrik" min="0" required placeholder="0">
                </div>
                <div class="item-kategori">
                    <label>8. Tagihan Hutang Usaha</label>
                    <input type="number" id="kat-hutang" min="0" required placeholder="0">
                </div>
                <div class="item-kategori">
                    <label>9. Bahan (Kertas/Tinta/dll)</label>
                    <input type="number" id="kat-bahan" min="0" required placeholder="0">
                </div>
            </div>

            <button type="submit" id="btnSimpan">📥 SIMPAN SEMUA PENGELUARAN</button>
            <div id="progress-bar">Menembak data ke database kilat... 🚀</div>
        </form>
    </div>
</div>

<script>
    // --- KUNCI SUPABASE REVOLUSI STUDIO ---
    const supabaseUrl = 'https://jxlpoqjfblnjxcfbnkjf.supabase.co'; 
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4bHBvcWpmYmxuanhjZmJua2pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwODI0NzYsImV4cCI6MjA5ODY1ODQ3Nn0.iJpxBgGtnjYNui7YdoLnrvfiL20pdGb2mLdUUvaGqJU'; 
    
    // Inisialisasi Klien Supabase
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    // Set Tanggal Hari Ini Secara Default
    document.getElementById('tgl-biaya').valueAsDate = new Date();

    // Daftar Mapping ID HTML ke Kategori Database
    const daftarKategori = [
        { id: "kat-gaji", nama: "Gaji Karyawan" },
        { id: "kat-bersih", nama: "Kebersihan" },
        { id: "kat-aman", nama: "Keamanan" },
        { id: "kat-inet", nama: "Internet" },
        { id: "kat-lahan", nama: "Sewa Lahan" },
        { id: "kat-tenda", nama: "Sewa Tenda" },
        { id: "kat-listrik", nama: "Tagihan Listrik" },
        { id: "kat-hutang", nama: "Tagihan Hutang Usaha" },
        { id: "kat-bahan", nama: "Bahan" }
    ];

    document.getElementById('formPengeluaran').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('btnSimpan');
        const progress = document.getElementById('progress-bar');
        btn.style.display = 'none';
        progress.style.display = 'block';

        // Format tanggal mutlak menjadi DD/MM/YYYY
        const rawDate = document.getElementById('tgl-biaya').value.split('-');
        const tglFormatted = `${rawDate[2]}/${rawDate[1]}/${rawDate[0]}`;

        // Kita siapkan gerbong kosong untuk menampung data
        let dataYangAkanDikirim = [];
        
        // Cek satu per satu, kalau ada nilainya, masukkan ke gerbong
        daftarKategori.forEach(kategori => {
            const nominal = parseInt(document.getElementById(kategori.id).value) || 0;
            if (nominal > 0) {
                dataYangAkanDikirim.push({
                    tanggal: tglFormatted,
                    kategori: kategori.nama,
                    keterangan: "Rekap Harian: " + kategori.nama,
                    jumlah: nominal
                });
            }
        });

        // Cek jika kasir rajin tapi gak ada pengeluaran sama sekali (diisi 0 semua)
        if (dataYangAkanDikirim.length === 0) {
            alert("✅ Laporan selesai! Tidak ada pengeluaran yang dicatat (semua 0).");
            ResetForm();
            return;
        }

        try {
            // EKSEKUSI BATCH INSERT SUPABASE (1X TEMBAK UNTUK BANYAK DATA)
            const { data, error } = await supabase
                .from('pengeluaran')
                .insert(dataYangAkanDikirim);

            if (error) throw error;

            alert(`✅ Selesai! ${dataYangAkanDikirim.length} kategori pengeluaran berhasil direkam dengan kecepatan kilat.`);
            ResetForm();

        } catch (error) {
            console.error("Gagal simpan Supabase:", error);
            alert("⚠️ Terjadi kesalahan saat menyimpan data. Cek koneksi internet Anda.");
            btn.style.display = 'block';
            progress.style.display = 'none';
        }
    });

    function ResetForm() {
        const btn = document.getElementById('btnSimpan');
        const progress = document.getElementById('progress-bar');
        
        document.getElementById('formPengeluaran').reset();
        document.getElementById('tgl-biaya').valueAsDate = new Date();
        
        btn.style.display = 'block';
        progress.style.display = 'none';
    }
</script>

</body>
</html>
