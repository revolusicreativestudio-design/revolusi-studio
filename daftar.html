<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Studio - Revolusi Photobox</title>
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --glass: rgba(255, 255, 255, 0.12); --glass-border: rgba(255, 255, 255, 0.2); --text-main: #ffffff; --ios-blue: #007AFF; }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; color: var(--text-main); min-height: 100vh; background: #0a0a0a; background-image: url('https://images.unsplash.com/photo-1647346425804-34383b95644b?q=80&w=1332&auto=format&fit=crop'); background-size: cover; background-attachment: fixed; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .container { width: 100%; max-width: 450px; }
        .glass-card { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 25px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); text-align: center; }
        
        .header-icon { font-size: 45px; margin-bottom: 10px; }
        h1 { margin: 0 0 5px 0; font-size: 24px; font-weight: 800; color: #ff9500; }
        p.subtitle { font-size: 13px; opacity: 0.8; margin: 0 0 25px 0; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; margin-left: 5px; opacity: 0.9; text-transform: uppercase; }
        input, select { width: 100%; padding: 14px 15px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; color: white; font-size: 15px; box-sizing: border-box; transition: 0.3s; outline: none; }
        input:focus, select:focus { border-color: var(--ios-blue); background: rgba(0,0,0,0.6); }
        option { background-color: #1a1a2e; color: white; }

        .total-box { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 122, 255, 0.15); border: 1px dashed var(--ios-blue); border-radius: 15px; padding: 15px; margin-top: 20px; margin-bottom: 20px; }
        .total-angka { font-size: 24px; font-weight: 900; color: #80c1ff; }

        .btn-submit { width: 100%; padding: 16px; background: var(--ios-blue); color: white; border: none; border-radius: 15px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0, 122, 255, 0.3); }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #555; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <div class="header-icon">📸</div>
        <h1>Pendaftaran Photobox</h1>
        <p class="subtitle">Isi data untuk masuk ke antrean</p>
        
        <form id="formDaftar" onsubmit="prosesDaftar(event)">
            <div class="form-group">
                <label>Nama Pelanggan</label>
                <input type="text" id="inputNama" required placeholder="Contoh: Kak Dinda">
            </div>

            <div class="form-group">
                <label>Nomor WhatsApp</label>
                <input type="tel" id="inputWA" required placeholder="Contoh: 08123456789">
            </div>

            <div class="form-group">
                <label>Pilih Tema / Studio</label>
                <select id="inputTema" required onchange="hitungTotal()">
                    <option value="Vintage Photobox">Vintage Photobox</option>
                    <option value="Basic Photobooth">Basic Photobooth</option>
                </select>
            </div>

            <div class="form-group">
                <label>Jumlah Orang</label>
                <input type="number" id="inputJumlah" value="1" min="1" max="8" required oninput="hitungTotal()" placeholder="Maksimal 8 orang">
            </div>

            <div class="form-group">
                <label>Metode Pembayaran</label>
                <select id="inputBayar" required>
                    <option value="Cash">Tunai / Cash</option>
                    <option value="QRIS">QRIS / Transfer</option>
                </select>
            </div>

            <div class="total-box">
                <div style="font-size: 12px; font-weight: bold; opacity: 0.8;">TOTAL BAYAR :</div>
                <div class="total-angka" id="tampil-harga">Rp 15.000</div>
            </div>

            <button type="submit" class="btn-submit" id="btnDaftar">🎟️ MASUKKAN KE ANTREAN</button>
        </form>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://jxlpoqjfblnjxcfbnkjf.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4bHBvcWpmYmxuanhjZmJua2pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwODI0NzYsImV4cCI6MjA5ODY1ODQ3Nn0.iJpxBgGtnjYNui7YdoLnrvfiL20pdGb2mLdUUvaGqJU'; 
    const dbKlien = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let hargaFinal = 15000;

    // 🧠 LOGIKA PINTAR PENENTUAN HARGA
    function hitungTotal() {
        const tema = document.getElementById('inputTema').value;
        const qty = parseInt(document.getElementById('inputJumlah').value) || 1;
        
        if (tema === "Vintage Photobox") {
            // Harga Bertingkat berdasarkan jumlah orang
            const daftarHargaVintage = {
                1: 15000,
                2: 25000,
                3: 35000,
                4: 40000,
                5: 50000,
                6: 60000,
                7: 70000,
                8: 80000
            };
            // Jika input melebihi 8, set mentok di harga 8 orang
            hargaFinal = daftarHargaVintage[qty] || 80000; 
        } 
        else if (tema === "Basic Photobooth") {
            // Harga Flat, berapapun jumlah orangnya tetap Rp 20.000
            hargaFinal = 20000;
        }

        // Tampilkan ke layar
        document.getElementById('tampil-harga').innerText = "Rp " + hargaFinal.toLocaleString('id-ID');
    }

    async function prosesDaftar(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnDaftar');
        btn.innerText = "Mengirim Data... ⏳";
        btn.disabled = true;

        const nama = document.getElementById('inputNama').value.trim();
        const wa = document.getElementById('inputWA').value.trim();
        const tema = document.getElementById('inputTema').value;
        const jumlah = parseInt(document.getElementById('inputJumlah').value) || 1;
        const bayar = document.getElementById('inputBayar').value;

        const d = new Date();
        const tglKirim = d.getDate().toString().padStart(2, '0') + "/" + 
                         (d.getMonth() + 1).toString().padStart(2, '0') + "/" + 
                         d.getFullYear() + " " + 
                         d.getHours().toString().padStart(2, '0') + ":" + 
                         d.getMinutes().toString().padStart(2, '0');

        try {
            const { error } = await dbKlien.from('transaksi').insert([{
                tanggal: tglKirim,
                nama: nama,
                wa: wa,
                tema: tema,
                jumlah: jumlah,
                pembayaran: bayar,
                total: hargaFinal,
                status: 'Menunggu'
            }]);

            if (error) throw error;

            alert("✅ Pendaftaran Berhasil! Pelanggan masuk ke antrean.");
            
            // Reset Form
            document.getElementById('formDaftar').reset();
            hitungTotal(); // Kembalikan harga ke default

        } catch (error) {
            console.error(error);
            alert("❌ Gagal mendaftar. Periksa koneksi internet Anda.");
        } finally {
            btn.innerText = "🎟️ MASUKKAN KE ANTREAN";
            btn.disabled = false;
        }
    }

    // Panggil saat halaman pertama dimuat agar harga awal muncul
    window.onload = hitungTotal;
</script>
</body>
</html>
