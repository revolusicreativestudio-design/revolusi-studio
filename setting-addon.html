<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Menu Add-on - Revolusi Studio</title>
    
    <!-- 🚀 WAJIB: Library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.15); --glass-border: rgba(255, 255, 255, 0.25);
            --ios-orange: #FF9500; --ios-red: #FF3B30; --ios-green: #34C759;
            --text-main: #ffffff;
        }
        body {
            margin: 0; padding: 20px; font-family: -apple-system, sans-serif;
            color: var(--text-main); background: #111;
            background-image: url('https://images.unsplash.com/photo-1614851099511-773084f6911d?q=80&w=1170&auto=format&fit=crop');
            background-size: cover; background-attachment: fixed;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .container { width: 100%; max-width: 800px; }
        .glass-card {
            background: var(--glass); backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); border-radius: 25px; padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); margin-bottom: 25px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;}
        .header h1 { margin: 0; font-size: 24px; font-weight: 800; }
        
        .form-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-bottom: 15px; }
        @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
        
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; margin-left: 5px; }
        input {
            width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px; color: white;
            font-size: 16px; box-sizing: border-box; transition: 0.3s;
        }
        input:focus { outline: none; border-color: var(--ios-orange); background: rgba(0,0,0,0.4); }
        
        button {
            padding: 14px 20px; border: none; border-radius: 12px; font-size: 15px;
            font-weight: 600; cursor: pointer; transition: 0.2s; color: white;
        }
        .btn-add { background: var(--ios-orange); width: 100%; box-shadow: 0 5px 15px rgba(255,149,0,0.3); }
        .btn-delete { background: rgba(255, 59, 48, 0.2); border: 1px solid var(--ios-red); color: #ff8a80; padding: 6px 12px; font-size: 13px; border-radius: 8px; }
        .btn-delete:hover { background: var(--ios-red); color: white; }
        button:active { transform: scale(0.97); }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(0, 0, 0, 0.3); padding: 15px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- BAGIAN 1: FORM TAMBAH / UPDATE -->
    <div class="glass-card">
        <div class="header">
            <h1>⚙️ Jendela Konfigurasi Add-on</h1>
        </div>
        <p style="font-size: 13px; opacity: 0.7; margin-top: -10px; margin-bottom: 20px;">*Jika mengetik nama produk yang sudah ada, sistem akan otomatis memperbarui harganya.</p>
        
        <form id="formSetting">
            <div class="form-grid">
                <div>
                    <label>Nama Produk Add-on / Aksesoris</label>
                    <input type="text" id="nama_produk" placeholder="Cth: Keychain Premium v2" required>
                </div>
                <div>
                    <label>Harga Jual (Rp)</label>
                    <input type="number" id="harga_jual" min="0" placeholder="0" required>
                </div>
            </div>
            <button type="submit" class="btn-add" id="btnSimpan">💾 SIMPAN / UPDATE PRICELIST</button>
        </form>
    </div>

    <!-- BAGIAN 2: TABEL DAFTAR AKTIF -->
    <div class="glass-card">
        <div class="header" style="border: none; margin-bottom: 10px;">
            <h2 style="margin:0; font-size: 18px;">Pricelist Produk Aktif</h2>
            <button onclick="muatAddonMaster()" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 8px; font-size: 13px;">🔄 Refresh</button>
        </div>
        
        <table style="margin-top: 10px;">
            <thead>
                <tr>
                    <th>Nama Produk / Layanan</th>
                    <th>Harga Standar</th>
                    <th style="text-align: right;">Opsi</th>
                </tr>
            </thead>
            <tbody id="tabel-master">
                <tr><td colspan="3" style="text-align: center;">Menghubungkan ke Supabase...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://jxlpoqjfblnjxcfbnkjf.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4bHBvcWpmYmxuanhjZmJua2pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwODI0NzYsImV4cCI6MjA5ODY1ODQ3Nn0.iJpxBgGtnjYNui7YdoLnrvfiL20pdGb2mLdUUvaGqJU'; 
    const dbKlien = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. Ambil & Tampilkan Data dari Supabase
    window.muatAddonMaster = async function() {
        try {
            const { data, error } = await dbKlien.from('master_addon').select('*').order('nama_produk', { ascending: true });
            if (error) throw error;

            const tbody = document.getElementById('tabel-master');
            tbody.innerHTML = "";

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; opacity: 0.5;">Belum ada produk terdaftar.</td></tr>`;
                return;
            }

            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${item.nama_produk}</strong></td>
                        <td style="color: #ffd699; font-weight: bold;">Rp ${item.harga_jual.toLocaleString('id-ID')}</td>
                        <td style="text-align: right;">
                            <button class="btn-delete" onclick="hapusMenu(${item.id}, '${item.nama_produk}')">🗑️ Hapus</button>
                        </td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error(error);
            document.getElementById('tabel-master').innerHTML = `<tr><td colspan="3" style="color: #ff8a80; text-align: center;">Koneksi database terputus.</td></tr>`;
        }
    };

    // 2. Tambah / Perbarui Data (UPSERT)
    document.getElementById('formSetting').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSimpan');
        const nama = document.getElementById('nama_produk').value.trim();
        const harga = document.getElementById('harga_jual').value;

        btn.innerText = "Sinkronisasi... ⏳";
        btn.disabled = true;

        try {
            // Menggunakan fungsi upsert otomatis dari PostgreSQL Supabase
            const { error } = await dbKlien
                .from('master_addon')
                .upsert({ nama_produk: nama, harga_jual: parseInt(harga) }, { onConflict: 'nama_produk' });

            if (error) throw error;

            alert("✅ Perubahan Pricelist Berhasil Disimpan!");
            document.getElementById('formSetting').reset();
            window.muatAddonMaster();
        } catch (error) {
            console.error(error);
            alert("❌ Gagal menyimpan setelan menu.");
        } finally {
            btn.innerText = "💾 SIMPAN / UPDATE PRICELIST";
            btn.disabled = false;
        }
    });

    // 3. Hapus Menu
    window.hapusMenu = async function(idMenu, namaMenu) {
        if (!confirm(`Apakah Anda yakin ingin menghapus produk "${namaMenu}" dari katalog?`)) return;

        try {
            const { error } = await dbKlien.from('master_addon').delete().eq('id', idMenu);
            if (error) throw error;
            window.muatAddonMaster();
        } catch (error) {
            console.error(error);
            alert("❌ Gagal menghapus menu.");
        }
    };

    // Jalankan otomatis saat halaman dimuat
    window.onload = window.muatAddonMaster;
</script>
</body>
</html>
