<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin & Kontrol Antrean - Revolusi Studio</title>
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --glass: rgba(255, 255, 255, 0.12); --glass-border: rgba(255, 255, 255, 0.2); --text-main: #ffffff; }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 15px; color: var(--text-main); min-height: 100vh; background: #0a0a0a; box-sizing: border-box; }
        .container { max-width: 1250px; margin: auto; }
        .glass-card { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 800; color: #ff9500; }
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        input, select { padding: 10px 14px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; color: white; font-size: 13px; outline: none; }
        input:focus, select:focus { border-color: #ff9500; }

        /* Tabel Data Antrean - Dibuat Kompak */
        .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th { background: rgba(0,0,0,0.7); padding: 12px 10px; color: #ff9500; font-weight: 700; white-space: nowrap; }
        td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
        tr:hover { background: rgba(255,255,255,0.03); }

        .badge { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; text-transform: uppercase; display: inline-block; text-align: center; }
        .badge-menunggu { background: rgba(255, 149, 0, 0.2); color: #ff9500; border: 1px solid rgba(255, 149, 0, 0.4); }
        .badge-selesai { background: rgba(52, 199, 89, 0.2); color: #34c759; border: 1px solid rgba(52, 199, 89, 0.4); }
        
        /* Tombol Aksi Tersusun Rapi & Kompak */
        .aksi-group { display: flex; flex-direction: column; gap: 4px; min-width: 95px; }
        .btn-aksi { padding: 5px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; text-align: center; width: 100%; }
        .btn-selesai { background: #34C759; color: white; }
        .btn-hapus { background: #FF3B30; color: white; }
        .btn-aksi:active { transform: scale(0.95); }

        .btn-nav { background: rgba(255,255,255,0.15); border: 1px solid var(--glass-border); color: white; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: bold; text-decoration: none; display: inline-block; }
        .btn-nav:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card header">
        <div>
            <h1>Panel Admin & Kontrol Studio</h1>
            <p id="sub-info" style="margin: 3px 0 0; opacity: 0.8; font-size: 13px;">Menghubungkan ke database Supabase... ⏳</p>
        </div>
        <div style="display: flex; gap: 8px;">
            <a href="daftar.html" class="btn-nav" target="_blank">➕ Daftar</a>
            <a href="laporan.html" class="btn-nav" target="_blank">📊 Laporan</a>
        </div>
    </div>

    <!-- KONTROL & PENCARIAN -->
    <div class="glass-card">
        <div class="toolbar">
            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <input type="text" id="cariNama" placeholder="Cari nama / WA..." oninput="filterData()">
                <select id="filterStudio" onchange="filterData()">
                    <option value="ALL">Semua Studio / Tema</option>
                    <option value="Classic Retro">Classic Retro (S1)</option>
                    <option value="Blue Room">Blue Room (S2)</option>
                    <option value="Night Fest">Night Fest (S3)</option>
                    <option value="KEYCHAIN">Keychain / Merch</option>
                    <option value="PRINT">Extra Print</option>
                    <option value="DRINK">Soft Drink</option>
                </select>
            </div>
            <button class="btn-nav" onclick="muatDataAdmin()" style="background: #ff9500; border: none; color: white;">🔄 Segarkan</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>Pelanggan</th>
                        <th>WhatsApp</th>
                        <th>Studio / Produk</th>
                        <th>Org</th>
                        <th>Bayar</th>
                        <th>Total (Rp)</th>
                        <th>Status</th>
                        <th style="text-align: center;">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabel-admin-body">
                    <tr><td colspan="9" style="text-align: center; opacity: 0.5; padding: 25px;">Memuat data antrean dari server...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://jxlpoqjfblnjxcfbnkjf.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4bHBvcWpmYmxuanhjZmJua2pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwODI0NzYsImV4cCI6MjA5ODY1ODQ3Nn0.iJpxBgGtnjYNui7YdoLnrvfiL20pdGb2mLdUUvaGqJU'; 
    const dbKlien = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let cacheDataTransaksi = [];

    async function muatDataAdmin() {
        try {
            document.getElementById('sub-info').innerText = "Menarik data terbaru... ⏳";
            
            const { data, error } = await dbKlien
                .from('transaksi')
                .select('*')
                .order('id', { ascending: false });

            if (error) throw error;

            cacheDataTransaksi = data || [];
            tampilkanTabel(cacheDataTransaksi);
            document.getElementById('sub-info').innerText = `Total ${cacheDataTransaksi.length} data terekam di database.`;

        } catch (e) {
            console.error(e);
            document.getElementById('sub-info').innerText = "❌ Gagal terhubung ke database Supabase.";
            document.getElementById('tabel-admin-body').innerHTML = `<tr><td colspan="9" style="text-align: center; color: #ff8a80; padding: 20px;">Gagal memuat data. Periksa koneksi Anda.</td></tr>`;
        }
    }

    function tampilkanTabel(dataList) {
        const tbody = document.getElementById('tabel-admin-body');
        
        if (!dataList || dataList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; opacity: 0.5; padding: 25px;">Tidak ada data ditemukan.</td></tr>`;
            return;
        }

        let html = "";
        dataList.forEach(t => {
            const statusStr = String(t.status || "Selesai").trim();
            const isMenunggu = statusStr.toLowerCase().includes("menunggu");
            const badgeClass = isMenunggu ? "badge-menunggu" : "badge-selesai";
            const totalAngka = parseInt(t.total || 0).toLocaleString('id-ID');

            html += `
                <tr>
                    <td style="white-space: nowrap;">${t.tanggal || '-'}<br><span style="font-size:10px; opacity:0.5;">#${t.id}</span></td>
                    <td><strong>${t.nama || '-'}</strong></td>
                    <td style="white-space: nowrap;">${t.wa && t.wa !== '-' ? `<a href="https://wa.me/68${t.wa.replace(/^0+/, '')}" target="_blank" style="color: #85e09b; text-decoration:none;">📱 ${t.wa}</a>` : '-'}</td>
                    <td><span style="background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 6px; font-size: 11px; white-space: nowrap;">${t.tema || '-'}</span></td>
                    <td>${t.jumlah || 1}</td>
                    <td>${t.pembayaran || 'Cash'}</td>
                    <td style="font-weight: bold; color: #80c1ff; white-space: nowrap;">Rp ${totalAngka}</td>
                    <td><span class="badge ${badgeClass}">${statusStr}</span></td>
                    <td style="text-align: center;">
                        <div class="aksi-group">
                            <button class="btn-aksi btn-selesai" onclick="ubahStatus(${t.id}, 'Selesai')">✅ Selesai</button>
                            <button class="btn-aksi btn-hapus" onclick="hapusData(${t.id})">🗑️ Hapus</button>
                        </div>
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = html;
    }

    function filterData() {
        const keyword = document.getElementById('cariNama').value.toLowerCase();
        const studioFilter = document.getElementById('filterStudio').value;

        const hasilFilter = cacheDataTransaksi.filter(t => {
            const namaMatch = String(t.nama || "").toLowerCase().includes(keyword) || String(t.wa || "").includes(keyword);
            
            if (studioFilter === "ALL") return namaMatch;
            
            const temaUpper = String(t.tema || "").toUpperCase();
            return namaMatch && temaUpper.includes(studioFilter.toUpperCase());
        });

        tampilkanTabel(hasilFilter);
    }

    async function ubahStatus(id, statusBaru) {
        if (!confirm(`Ubah status transaksi #${id} menjadi "${statusBaru}"?`)) return;

        try {
            const { error } = await dbKlien
                .from('transaksi')
                .update({ status: statusBaru })
                .eq('id', id);

            if (error) throw error;
            muatDataAdmin();
        } catch (e) {
            alert("Gagal mengubah status: " + e.message);
        }
    }

    async function hapusData(id) {
        if (!confirm(`⚠️ PERINGATAN: Apakah Anda yakin ingin menghapus permanen data transaksi #${id} ini?`)) return;

        try {
            const { error } = await dbKlien
                .from('transaksi')
                .delete()
                .eq('id', id);

            if (error) throw error;
            muatDataAdmin();
        } catch (e) {
            alert("Gagal menghapus data: " + e.message);
        }
    }

    window.onload = muatDataAdmin;
</script>
</body>
</html>
