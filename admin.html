<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Revolusi Studio Supabase</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.15); --glass-border: rgba(255, 255, 255, 0.25);
            --ios-blue: #007AFF; --ios-green: #34C759; --ios-red: #FF3B30; --wa-green: #25D366;
            --text-main: #ffffff;
        }

        body {
            margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1614851099511-773084f6911d?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover; background-position: center; background-attachment: fixed;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; color: var(--text-main); padding-top: 20px;
        }

        .admin-container { width: 100%; max-width: 900px; padding: 0 20px; box-sizing: border-box; }

        .header-glass {
            background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 25px; padding: 20px 30px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            flex-wrap: wrap; gap: 10px;
        }

        h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }

        .btn-refresh {
            background: rgba(255, 255, 255, 0.2); border: 1px solid var(--glass-border); color: white;
            padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.3s;
        }
        .btn-refresh:hover { background: rgba(255, 255, 255, 0.3); }

        .btn-xray { background: rgba(255, 59, 48, 0.2); border-color: rgba(255, 59, 48, 0.5); }
        .btn-xray:hover { background: rgba(255, 59, 48, 0.4); }

        .table-container {
            background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 25px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(255, 255, 255, 0.1); padding: 18px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
        td { padding: 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 15px; }
        tr:last-child td { border-bottom: none; }

        .btn-action {
            display: inline-block; padding: 8px 14px; border: none; border-radius: 10px; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: 0.2s; margin-right: 5px; margin-bottom: 5px; text-decoration: none; text-align: center;
        }
        .btn-selesai { background: var(--ios-green); color: white; }
        .btn-batal { background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid var(--glass-border); }
        .btn-wa { background: var(--wa-green); color: white; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        .btn-wa:hover { background: #1ebd5a; }
        .status-badge { padding: 6px 12px; border-radius: 10px; font-size: 13px; font-weight: bold; display: inline-block; margin-bottom: 5px; }

        @media (max-width: 600px) {
            th:nth-child(1), td:nth-child(1) { display: none; } 
        }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="header-glass">
        <div>
            <h1>Admin Panel (Supabase)</h1>
            <span id="tgl-skrg" style="font-size: 12px; opacity: 0.7;">Memuat tanggal...</span>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-refresh btn-xray" id="btn-toggle" onclick="toggleMode()">📂 Tampilkan Semua Data</button>
            <button class="btn-refresh" onclick="ambilDataDariSupabase()">🔄 Segarkan</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Waktu</th>
                    <th>Nama Pelanggan</th>
                    <th>Studio</th>
                    <th>Status</th>
                    <th>Tindakan / Kirim File</th>
                </tr>
            </thead>
            <tbody id="table-admin">
                <tr><td colspan="5" style="text-align:center;">Menghubungkan ke database kilat Supabase...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // --- KUNCI SUPABASE REVOLUSI STUDIO (SUDAH DIINJEKSI OTOMATIS) ---
    const supabaseUrl = 'https://jxlpoqjfblnjxcfbnkjf.supabase.co'; 
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4bHBvcWpmYmxuanhjZmJua2pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwODI0NzYsImV4cCI6MjA5ODY1ODQ3Nn0.iJpxBgGtnjYNui7YdoLnrvfiL20pdGb2mLdUUvaGqJU'; 
    
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
    let tampilkanSemua = false; 

    function formatNomorWA(nomor) {
        if (!nomor) return "";
        let noBersih = String(nomor).replace(/[^0-9]/g, '');
        if (noBersih.startsWith('0')) noBersih = '62' + noBersih.substring(1);
        return noBersih;
    }

    function toggleMode() {
        tampilkanSemua = !tampilkanSemua;
        document.getElementById('btn-toggle').innerText = tampilkanSemua ? "📅 Filter Hari Ini Saja" : "📂 Tampilkan Semua Data";
        ambilDataDariSupabase(); 
    }

    async function ambilDataDariSupabase() {
        try {
            const tableBody = document.getElementById('table-admin');
            const d = new Date();
            
            // Format target harian DD/MM/YYYY
            const tglTarget = d.getDate().toString().padStart(2, '0') + "/" + 
                              (d.getMonth() + 1).toString().padStart(2, '0') + "/" + 
                              d.getFullYear();
                              
            document.getElementById('tgl-skrg').innerText = "Hari ini: " + d.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            // Bangun Query Supabase (Urutan ID terbaru di paling atas)
            let query = supabase.from('transaksi').select('*');
            
            if (!tampilkanSemua) {
                query = query.eq('tanggal', tglTarget);
            }
            
            const { data: dataTransaksi, error } = await query.order('id', { ascending: false });

            if (error) throw error;

            tableBody.innerHTML = "";

            if (!dataTransaksi || dataTransaksi.length === 0) {
                const pesan = tampilkanSemua ? "Database Supabase masih kosong melongpong!" : "Belum ada pendaftaran hari ini.";
                tableBody.innerHTML = `<tr><td colspan='5' style='text-align:center; padding:40px; opacity:0.6;'>${pesan}</td></tr>`;
                return;
            }

            dataTransaksi.forEach((item) => {
                const status = String(item.status || "Menunggu").trim();
                const nomorAsli = item.wa || "";
                const noWA = formatNomorWA(nomorAsli);
                const namaPelanggan = item.nama || "Kak";
                
                let tombolWA = "";
                if (noWA.length > 8) { 
                    const pesanTeks = `Halo ${namaPelanggan},\nTerima kasih sudah berfoto di Revolusi Studio! 📸\n\nBerikut adalah link Google Drive untuk mengunduh soft file foto kakak:\n[Paste Link Drive Di Sini]\n\nJangan lupa tag IG kami ya kak! ✨`;
                    const pesanEncoded = encodeURIComponent(pesanTeks);
                    tombolWA = `<a href="https://wa.me/${noWA}?text=${pesanEncoded}" target="_blank" class="btn-action btn-wa">💬 Chat WA</a>`;
                }

                let actionContent = "";
                let rowOpacity = "1";

                if (status.toLowerCase() === "menunggu" || status === "") {
                    actionContent = `
                        ${tombolWA}
                        <button class="btn-action btn-selesai" onclick="updateStatus(${item.id}, 'Selesai')">Selesai</button>
                        <button class="btn-action btn-batal" onclick="updateStatus(${item.id}, 'Batal')">Batal</button>
                    `;
                } else {
                    rowOpacity = "0.8"; 
                    const color = status.toLowerCase() === "selesai" ? "#34C759" : "#FF3B30";
                    actionContent = `
                        ${tombolWA}
                        <span class="status-badge" style="background:${color}22; color:${color}">${status}</span>
                    `;
                }

                tableBody.innerHTML += `
                    <tr style="opacity: ${rowOpacity}">
                        <td style="font-size: 12px; opacity: 0.6;">${item.tanggal}</td>
                        <td><strong>${namaPelanggan}</strong><br><small style="color: #85e09b;">${nomorAsli}</small></td>
                        <td><span style="font-size:13px;">${item.tema || '-'} (x${item.jumlah})</span></td>
                        <td style="font-weight: 600;">${status}</td>
                        <td>${actionContent}</td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error(error);
            document.getElementById('table-admin').innerHTML = "<tr><td colspan='5' style='color:#ff8a80; text-align:center;'>Gagal sinkronisasi data dengan Supabase. Cek Internet.</td></tr>";
        }
    }

    async function updateStatus(idTransaksi, statusBaru) {
        if (!confirm("Ubah status menjadi " + statusBaru + "?")) return;
        
        const btn = event.target;
        const teksAsli = btn.innerText;
        btn.innerText = "...";
        btn.disabled = true;

        try {
            // Tembak langsung menggunakan ID Unik Baris Supabase (Akurasi 100% anti tertukar!)
            const { error } = await supabase
                .from('transaksi')
                .update({ status: statusBaru })
                .eq('id', idTransaksi);

            if (error) throw error;
            
            ambilDataDariSupabase(); // Render ulang data kilat
        } catch (e) {
            console.error(e);
            alert("Gagal memperbarui status ke server!");
        } finally {
            btn.innerText = teksAsli;
            btn.disabled = false;
        }
    }

    // Jalankan pertama kali
    ambilDataDariSupabase();
    // Auto-refresh data live setiap 15 detik (Supabase sangat ringan, jadi bisa lebih cepat dari 30 detik!)
    setInterval(ambilDataDariSupabase, 15000);
</script>

</body>
</html>
