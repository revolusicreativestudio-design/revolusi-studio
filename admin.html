<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Revolusi Studio</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.25);
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --wa-green: #25D366; /* Warna Khas WhatsApp */
            --text-main: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1614851099511-773084f6911d?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover; background-position: center; background-attachment: fixed;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; color: var(--text-main); padding-top: 20px;
        }

        .admin-container { width: 100%; max-width: 900px; padding: 0 20px; box-sizing: border-box; }

        .header-glass {
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 25px; padding: 20px 30px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }

        .btn-refresh {
            background: rgba(255, 255, 255, 0.2); border: 1px solid var(--glass-border); color: white;
            padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.3s;
        }
        .btn-refresh:hover { background: rgba(255, 255, 255, 0.3); }

        .table-container {
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 25px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(255, 255, 255, 0.1); padding: 18px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; opacity: 0.8; }
        td { padding: 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-size: 15px; }
        tr:last-child td { border-bottom: none; }

        /* Tombol Aksi Liquid */
        .btn-action {
            display: inline-block; padding: 8px 14px; border: none; border-radius: 10px;
            font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; margin-right: 5px; margin-bottom: 5px;
            text-decoration: none; text-align: center;
        }
        .btn-action:active { transform: scale(0.95); }

        .btn-selesai { background: var(--ios-green); color: white; }
        .btn-batal { background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid var(--glass-border); }
        .btn-wa { background: var(--wa-green); color: white; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        .btn-wa:hover { background: #1ebd5a; }

        .status-badge { padding: 6px 12px; border-radius: 10px; font-size: 13px; font-weight: bold; display: inline-block; margin-bottom: 5px; }

        @media (max-width: 600px) {
            body { padding-top: 10px; }
            th:nth-child(1), td:nth-child(1) { display: none; } 
            .header-glass { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="header-glass">
        <div>
            <h1>Admin Panel</h1>
            <span id="tgl-skrg" style="font-size: 12px; opacity: 0.7;">Memuat tanggal...</span>
        </div>
        <button class="btn-refresh" onclick="ambilDataDariSheet()">🔄 Segarkan</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Waktu</th>
                    <th>Nama Pelanggan</th>
                    <th>Studio</th>
                    <th>Status</th>
                    <th>Tindakan / Kirim File</th>
                </tr>
            </thead>
            <tbody id="table-admin">
                <tr>
                    <td colspan="5" style="text-align:center;">Menghubungkan ke server...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // URL DEPLOYMENT TERBARU ANDA (Pastikan URL-nya sudah yang paling update)
    const urlScript = "https://script.google.com/macros/s/AKfycbwPdoH2h6VZLGb_LBeIO8Fi1yBrmY8Efm2hWry_9myk6mCbSkQqi6WQOHaXxIxk43BAjQ/exec";
    let dataSeluruhnya = []; 

    // --- FUNGSI FORMAT NOMOR WA ---
    // Mengubah format 08... menjadi 628... dan membuang strip/spasi
    function formatNomorWA(nomor) {
        if (!nomor) return "";
        let noBersih = String(nomor).replace(/[^0-9]/g, ''); // Hapus semua kecuali angka
        if (noBersih.startsWith('0')) {
            noBersih = '62' + noBersih.substring(1);
        }
        return noBersih;
    }

    async function ambilDataDariSheet() {
        try {
            // Paksa anti-cache agar data selalu real-time
            const urlAntiCache = urlScript + "?v=" + new Date().getTime();
            const response = await fetch(urlAntiCache);
            const resJson = await response.json();
            dataSeluruhnya = resJson.transaksi || [];
            
            const tableBody = document.getElementById('table-admin');
            const d = new Date();
            const tglHariIni = d.getDate() + "/" + (d.getMonth() + 1) + "/" + d.getFullYear();
            document.getElementById('tgl-skrg').innerText = "Hari ini: " + d.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            // Filter data khusus hari ini saja
            const dataHariIni = dataSeluruhnya.filter(item => {
                const tglData = String(item.tanggal || item.Tanggal).trim().split(' ')[0];
                return tglData === tglHariIni;
            });
            
            tableBody.innerHTML = "";

            if (dataHariIni.length === 0) {
                tableBody.innerHTML = "<tr><td colspan='5' style='text-align:center; padding:40px; opacity:0.6;'>Belum ada pendaftaran hari ini.</td></tr>";
                return;
            }

            dataHariIni.reverse().forEach((item) => {
                const statusRaw = item.status || item.Status || "";
                const status = String(statusRaw).trim();
                const barisAsli = dataSeluruhnya.indexOf(item) + 2;
                
                // Siapkan Tombol WhatsApp
                const nomorAsli = item.wa || item.WA || "";
                const noWA = formatNomorWA(nomorAsli);
                const namaPelanggan = item.nama || item.Nama || "Kak";
                
                let tombolWA = "";
                if (noWA.length > 8) { // Cek jika nomornya valid (lebih dari 8 angka)
                    // Template Pesan yang akan otomatis terketik di HP Anda
                    const pesanTeks = `Halo ${namaPelanggan},\nTerima kasih sudah berfoto di Revolusi Studio! 📸\n\nBerikut adalah link Google Drive untuk mengunduh soft file foto kakak:\n[Paste Link Drive Di Sini]\n\nJangan lupa tag IG kami ya kak! ✨`;
                    const pesanEncoded = encodeURIComponent(pesanTeks);
                    
                    tombolWA = `<a href="https://wa.me/${noWA}?text=${pesanEncoded}" target="_blank" class="btn-action btn-wa">💬 Chat WA</a>`;
                }

                let actionContent = "";
                let rowOpacity = "1";

                if (status.toLowerCase() === "menunggu" || status === "") {
                    actionContent = `
                        ${tombolWA}
                        <button class="btn-action btn-selesai" onclick="updateStatus(${barisAsli}, 'Selesai')">Selesai</button>
                        <button class="btn-action btn-batal" onclick="updateStatus(${barisAsli}, 'Batal')">Batal</button>
                    `;
                } else {
                    rowOpacity = "0.8"; // Opacity dinaikkan sedikit agar tombol WA tetap enak dilihat
                    const color = status.toLowerCase() === "selesai" ? "#34C759" : "#FF3B30";
                    actionContent = `
                        ${tombolWA}
                        <span class="status-badge" style="background:${color}22; color:${color}">${status}</span>
                    `;
                }

                tableBody.innerHTML += `
                    <tr style="opacity: ${rowOpacity}">
                        <td style="font-size: 12px; opacity: 0.6;">${item.tanggal || item.Tanggal}</td>
                        <td><strong>${namaPelanggan}</strong><br><small style="color: #85e09b;">${nomorAsli}</small></td>
                        <td><span style="font-size:13px;">${item.tema || item.Tema}</span></td>
                        <td style="font-weight: 600;">${status}</td>
                        <td>${actionContent}</td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error(error);
            document.getElementById('table-admin').innerHTML = "<tr><td colspan='5' style='color:#ff8a80; text-align:center;'>Gagal sinkronisasi data dengan server.</td></tr>";
        }
    }

    async function updateStatus(nomorBaris, statusBaru) {
        if (!confirm("Ubah status menjadi " + statusBaru + "?")) return;
        
        const btn = event.target;
        const teksAsli = btn.innerText;
        btn.innerText = "...";
        btn.disabled = true;

        const payload = {
            type: "update",
            index: nomorBaris,
            status: statusBaru
        };

        try {
            const resp = await fetch(urlScript, { method: 'POST', body: JSON.stringify(payload) });
            const hasil = await resp.text();
            
            if (hasil.includes("Sukses")) {
                ambilDataDariSheet(); // Refresh tabel
            } else {
                alert("Gagal update di Sheets: " + hasil);
            }
        } catch (e) {
            alert("Terjadi kesalahan koneksi!");
        } finally {
            btn.innerText = teksAsli;
            btn.disabled = false;
        }
    }

    ambilDataDariSheet();
    // Auto-refresh setiap 30 detik
    setInterval(ambilDataDariSheet, 30000);
</script>

</body>
</html>
